name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/docs-quality.yml'

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Markdown structure and local links
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $markdownFiles = Get-ChildItem -Recurse -File -Filter '*.md'
          if ($markdownFiles.Count -eq 0) { throw 'No Markdown files found.' }

          foreach ($file in $markdownFiles) {
            $content = Get-Content -Raw -Encoding utf8 -LiteralPath $file.FullName
            $h1Count = ([regex]::Matches($content, '(?m)^#\s+')).Count
            if ($h1Count -ne 1) { throw "$($file.FullName) must contain exactly one H1; found $h1Count." }

            foreach ($match in [regex]::Matches($content, '\]\(([^)#]+)(?:#[^)]+)?\)')) {
              $target = $match.Groups[1].Value
              if ($target -match '^(https?://|mailto:|#)') { continue }
              $resolved = Join-Path $file.DirectoryName $target
              if (-not (Test-Path -LiteralPath $resolved)) {
                throw "Broken local link in $($file.FullName): $target"
              }
            }
          }
      - name: Validate design invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredMarkers = @{
            'docs/travel-mediation-plan.md' = @('0단계', '1~5단계', 'CategoryDecisionContract', 'ContinuityAuditReport', 'FinalPlanRecord')
            'docs/agent-architecture.md' = @('UserProxyAgent', 'CandidateEvidenceAgent', 'CategoryArbiterAgent', 'TripOrchestratorAgent', 'PlanFinalizerAgent', 'FactConstraintValidator', 'RunController')
            'docs/survey-v4-profile-v1.md' = @('47개', '정확히 11개', '0~2개', 'ProfilePatchCandidate', 'CanonicalProfile')
            'docs/provider-evidence-policy.md' = @('타베로그', 'dining_slot_inventory', 'EvidenceSnapshot', 'BOOKABLE')
            'docs/flight-referee-implementation.md' = @('CategoryProposal', 'FactConstraintValidator', 'NO_SAFE_DECISION')
            'docs/transport-referee-implementation.md' = @('matrixVersion', 'leximin', '공급자 공백')
            'docs/accommodation-referee-implementation.md' = @('객실 조합', 'CategoryProposal', 'BOOKABLE', 'leximin')
          }
          foreach ($path in $requiredMarkers.Keys) {
            $content = Get-Content -Raw -Encoding utf8 -LiteralPath $path
            foreach ($marker in $requiredMarkers[$path]) {
              if (-not $content.Contains($marker)) { throw "Missing design invariant in ${path}: $marker" }
            }
          }
          $plan = Get-Content -Raw -Encoding utf8 -LiteralPath 'docs/travel-mediation-plan.md'
          if ($plan -match '(?m)^- \[x\]') { throw 'MVP scope must not be marked as implemented.' }
          if (-not $plan.Contains('0단계와 6단계에는 카테고리 중재관이 없다') -or -not $plan.Contains('DateResolver')) {
            throw 'Stage 0 must use deterministic DateResolver without category arbitration.'
          }
      - name: Reject committed secret-like values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '(api[_-]?key|client[_-]?secret|password)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{16,}'
          $secretMatches = @(git grep -n -I -E $pattern -- . ':!docs/*.md')
          $grepExitCode = $LASTEXITCODE
          if ($grepExitCode -eq 1) { exit 0 }
          if ($grepExitCode -ne 0) { throw "Secret scan failed to run (git grep exit code: $grepExitCode)." }
          Write-Error "Potential secret detected:`n$($secretMatches -join [Environment]::NewLine)"
          exit 1
