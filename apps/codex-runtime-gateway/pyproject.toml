[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-codex-runtime-gateway"
version = "0.1.0"
description = "MOA Agent가 Codex Auth를 직접 보지 않고 호출하는 localhost Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<1",
  "moa-agents>=0.1.0",
  "openai-codex>=0.144.4,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.50,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "httpx2>=2.10,<3", "pytest>=9,<10"]

[project.scripts]
moa-codex-gateway = "moa_codex_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moa_codex_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../../packages/agents"]
