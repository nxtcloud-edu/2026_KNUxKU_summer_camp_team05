[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-codex-runtime-gateway"
version = "0.1.0"
description = "Localhost-only Codex OAuth execution gateway for MOA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<1",
  "jsonschema>=4.26,<5",
  "openai-codex>=0.144.4,<0.145",
  "pydantic>=2.13,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.10,<3",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "types-jsonschema>=4.26,<5",
]

[project.scripts]
moa-codex-gateway = "moa_codex_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moa_codex_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moa_codex_gateway"]
