[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-agents"
version = "0.1.0"
description = "MOA 여행 중재 서비스의 역할별 Agent 런타임"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
